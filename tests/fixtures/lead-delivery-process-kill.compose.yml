services:
  redis:
    image: redis:7.4.7-alpine3.21
    user: redis
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --dir
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 1s
      retries: 20
    ports:
      - '127.0.0.1:${R04_REDIS_PORT}:6379'
    volumes:
      - r04-data:/data

volumes:
  r04-data:
    name: ${R04_REDIS_VOLUME_NAME}
