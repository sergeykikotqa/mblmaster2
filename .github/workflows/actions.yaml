name: GitHub Actions

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - codex/o2-4-reliability

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://ci.example.invalid' }}
    strategy:
      matrix:
        node-version:
          - 22
          - 24
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js v${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check clean Nginx production image
        if: matrix.node-version == 22
        run: npm run check:nginx-clean-build
      # - run: npm test

  working-branch-gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/o2-4-reliability'
    runs-on: ubuntu-latest
    services:
      metrics-health-redis:
        image: redis:7.4.7-alpine3.21
        ports:
          - '127.0.0.1:6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      PUBLIC_SITE_URL: https://ci.mbl.invalid
      PUBLIC_PRIMARY_SEO_CITY_ID: irkutsk
      PUBLIC_ENABLE_LEAD_TRACKING: 'true'
      PUBLIC_YANDEX_METRIKA_ID: '12345678'
      PUBLIC_YANDEX_VERIFICATION: ci-synthetic-verification
      PUBLIC_GA4_ID: G-CISYNTHETIC
      PUBLIC_LEAD_FORM_ABANDON_MS: '60000'
      PUBLIC_ENABLE_RUM_WEB_VITALS: 'true'
      PUBLIC_RUM_LCP_ALERT_THRESHOLD_MS: '2500'
      PUBLIC_BUSINESS_PHONE: +7 (900) 000-00-01
      PUBLIC_BUSINESS_EMAIL: ci@example.invalid
      PUBLIC_BUSINESS_ADDRESS_LOCALITY: Иркутск
      PUBLIC_BUSINESS_ADDRESS_DISTRICT: Тестовый район
      PUBLIC_BUSINESS_STREET_ADDRESS: Тестовая улица, 1
      PUBLIC_BUSINESS_REGION: Иркутская область
      PUBLIC_BUSINESS_POSTAL_CODE: '664000'
      PUBLIC_BUSINESS_OPENING_HOURS: Mo-Fr 09:00-18:00
      PUBLIC_BUSINESS_OPENING_HOURS_TEXT: Пн–Пт 09:00–18:00
      PUBLIC_BUSINESS_IMAGE: https://assets.example.invalid/business.jpg
      PUBLIC_BUSINESS_SAME_AS: https://social.example.invalid/mbl
      PUBLIC_TELEGRAM_URL: https://t.me/mbl_ci_test
      PUBLIC_BUSINESS_YANDEX_MAPS_URL: https://yandex.example.invalid/maps/mbl
      PUBLIC_BUSINESS_GOOGLE_MAPS_URL: https://google.example.invalid/maps/mbl
      PUBLIC_BUSINESS_PRICE_RANGE: ₽₽
      PUBLIC_BUSINESS_LAT: '52.2864'
      PUBLIC_BUSINESS_LON: '104.2808'
      PUBLIC_BUSINESS_LEGAL_NAME: ИП Тестовый Владелец
      PUBLIC_BUSINESS_TAX_ID: '000000000000'
      PUBLIC_BUSINESS_REGISTRATION_ID: '000000000000000'
      PUBLIC_BUSINESS_CHECKING_ACCOUNT: '00000000000000000000'
      PUBLIC_BUSINESS_BIC: '000000000'
      PUBLIC_BUSINESS_BANK_NAME: Тестовый банк
      PUBLIC_BUSINESS_REGISTERED_ADDRESS: Иркутск, тестовый адрес
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:runtime-redirects
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - name: Check Metrics Health State Store
        env:
          METRICS_HEALTH_STATE_SMOKE_ALLOW_REDIS: 'true'
          METRICS_HEALTH_STATE_SMOKE_REDIS_URL: redis://127.0.0.1:6379/15
        run: npm run check:metrics-health-state-store
      - run: npm run check:release-policy
      - run: npm run check:public-build-env
      - run: npm run build

  pr-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Export CHROME_PATH
        run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:external-monitor
      - run: npm run check:telegram-monitor
      - run: npm run check:e2e:smoke
      - run: npm run check:accessibility
      - run: npm run check:seo:smoke
      - run: npm run check:lighthouse:smoke
      - name: Upload Lighthouse artifacts (smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .lighthouseci/*.html
            .lighthouseci/*.json
          if-no-files-found: warn
          retention-days: 14

  full-audit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      metrics-health-redis:
        image: redis:7.4.7-alpine3.21
        ports:
          - '127.0.0.1:6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://ci.example.invalid' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Export CHROME_PATH
        run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run check:architecture
      - run: npm run check:generated-pages-sync
      - run: npm run check:slugs
      - run: npm run check:no-district-left
      - run: npm run check:secrets-scope
      - run: npm run generate:runtime-redirects
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:external-monitor
      - run: npm run check:telegram-monitor
      - run: npm run check:image-policy
      - run: npm run build
      - run: npm run check:performance-budgets
      - run: npm run check:redirects-sitemap
      - run: npm run check:no-admin-in-sitemap
      - run: npm run check:no-legacy-index
      - run: npm run check:indexability-runtime-consistency
      - run: npm run check:indexable-link-coverage
      - run: npm run check:admin-token-storage
      - run: npm run check:contact-hidden-fields
      - name: Check Metrics Smoke
        env:
          METRICS_ADMIN_TOKEN: ci-metrics-token
        run: npm run check:metrics-smoke
      - run: npm run check:metrics-health-smoke
      - name: Check Metrics Health State Store
        env:
          METRICS_HEALTH_STATE_SMOKE_ALLOW_REDIS: 'true'
          METRICS_HEALTH_STATE_SMOKE_REDIS_URL: redis://127.0.0.1:6379/15
        run: npm run check:metrics-health-state-store
      - run: npm run check:metrics-health-fallback
      - run: npm run check:metrics-health-fallback-alert
      - run: npm run check:lead-api
      - run: npm run check:redis-outage
      - name: Check Webhook Delivery
        env:
          CONTACT_WORKER_TOKEN: ci-worker-token
        run: npm run check:webhook-delivery
      - run: npm run check:accessibility:full
      - run: npm run check:e2e
      - run: npm run check:seo
      - run: npm run check:lighthouse
      - run: npm run check:audit
      - name: Upload Visual Audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/mobile-audit/**
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .lighthouseci/*.html
            .lighthouseci/*.json
          if-no-files-found: warn
          retention-days: 14
