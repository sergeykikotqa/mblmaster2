name: GitHub Actions

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - codex/o2-4-reliability

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://ci.example.invalid' }}
    strategy:
      matrix:
        node-version:
          - 22
          - 24
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js v${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check clean Nginx production image
        if: matrix.node-version == 22
        run: npm run check:nginx-clean-build
      # - run: npm test

  pr-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Export CHROME_PATH
        run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:external-monitor
      - run: npm run check:telegram-monitor
      - run: npm run check:e2e:smoke
      - run: npm run check:accessibility
      - run: npm run check:seo:smoke
      - run: npm run check:lighthouse:smoke
      - name: Upload Lighthouse artifacts (smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .lighthouseci/*.html
            .lighthouseci/*.json
          if-no-files-found: warn
          retention-days: 14

  full-audit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://ci.example.invalid' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Export CHROME_PATH
        run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run check:architecture
      - run: npm run check:generated-pages-sync
      - run: npm run check:slugs
      - run: npm run check:no-district-left
      - run: npm run check:secrets-scope
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:external-monitor
      - run: npm run check:telegram-monitor
      - run: npm run check:image-policy
      - run: npm run build
      - run: npm run check:performance-budgets
      - run: npm run check:redirects-sitemap
      - run: npm run check:no-admin-in-sitemap
      - run: npm run check:no-legacy-index
      - run: npm run check:indexability-runtime-consistency
      - run: npm run check:indexable-link-coverage
      - run: npm run check:admin-token-storage
      - run: npm run check:contact-hidden-fields
      - name: Check Metrics Smoke
        env:
          METRICS_ADMIN_TOKEN: ci-metrics-token
        run: npm run check:metrics-smoke
      - run: npm run check:metrics-health-smoke
      - run: npm run check:metrics-health-state-store
      - run: npm run check:metrics-health-fallback
      - run: npm run check:metrics-health-fallback-alert
      - run: npm run check:lead-api
      - run: npm run check:redis-outage
      - name: Check Webhook Delivery
        env:
          CONTACT_WORKER_TOKEN: ci-worker-token
        run: npm run check:webhook-delivery
      - run: npm run check:accessibility:full
      - run: npm run check:e2e
      - run: npm run check:seo
      - run: npm run check:lighthouse
      - run: npm run check:audit
      - name: Upload Visual Audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/design-audit/**
            .tmp/mobile-audit/**
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .lighthouseci/*.html
            .lighthouseci/*.json
          if-no-files-found: warn
          retention-days: 14
