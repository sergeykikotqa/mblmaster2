name: Metrics Health Cron

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  trigger-metrics-health:
    runs-on: ubuntu-latest
    steps:
      - name: Validate metrics health worker configuration
        id: config
        run: |
          token="${METRICS_HEALTH_WORKER_TOKEN:-${METRICS_WORKER_TOKEN:-$CONTACT_WORKER_TOKEN}}"
          if [ -z "${METRICS_HEALTH_WORKER_URL}" ] || [ -z "$token" ]; then
            echo "Metrics health worker config is missing, skipping trigger."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "token=$token" >> "$GITHUB_OUTPUT"
        env:
          METRICS_HEALTH_WORKER_URL: ${{ vars.METRICS_HEALTH_WORKER_URL }}
          METRICS_HEALTH_WORKER_TOKEN: ${{ secrets.METRICS_HEALTH_WORKER_TOKEN }}
          METRICS_WORKER_TOKEN: ${{ secrets.METRICS_WORKER_TOKEN }}
          CONTACT_WORKER_TOKEN: ${{ secrets.CONTACT_WORKER_TOKEN }}

      - name: Trigger conversion health evaluator
        if: ${{ steps.config.outputs.ready == 'true' }}
        run: |
          curl --fail --silent --show-error \
            -X POST "${METRICS_HEALTH_WORKER_URL}" \
            -H "Authorization: Bearer ${WORKER_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"sendAlert":true}'
        env:
          METRICS_HEALTH_WORKER_URL: ${{ vars.METRICS_HEALTH_WORKER_URL }}
          WORKER_TOKEN: ${{ steps.config.outputs.token }}
