name: Lead Worker Cron

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  trigger-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Validate worker configuration
        id: config
        run: |
          if [ -z "${CONTACT_WORKER_URL}" ] || [ -z "${CONTACT_WORKER_TOKEN}" ]; then
            echo "Worker config is missing, skipping trigger."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
        env:
          CONTACT_WORKER_URL: ${{ vars.CONTACT_WORKER_URL }}
          CONTACT_WORKER_TOKEN: ${{ secrets.CONTACT_WORKER_TOKEN }}

      - name: Trigger lead delivery worker
        if: ${{ steps.config.outputs.ready == 'true' }}
        run: |
          curl --fail --silent --show-error \
            -X POST "${CONTACT_WORKER_URL}" \
            -H "Authorization: Bearer ${CONTACT_WORKER_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"limit":20}'
        env:
          CONTACT_WORKER_URL: ${{ vars.CONTACT_WORKER_URL }}
          CONTACT_WORKER_TOKEN: ${{ secrets.CONTACT_WORKER_TOKEN }}
