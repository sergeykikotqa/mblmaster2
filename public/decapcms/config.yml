backend:
  name: git-gateway
  branch: main

media_folder: 'src/assets/images'
public_folder: '/_astro'

collections:
  - name: 'post'
    label: 'Post'
    folder: 'src/content/post'
    create: true
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Excerpt', name: 'excerpt', widget: 'string' }
      - { label: 'Category', name: 'category', widget: 'string' }
      - {
          label: 'Tags',
          name: 'tags',
          widget: 'list',
          allow_add: true,
          allow_delete: true,
          collapsed: false,
          field: { label: 'Tag', name: 'tag', widget: 'string' },
        }
      - { label: 'Image', name: 'image', widget: 'string' }
      - { label: 'Publish Date', name: 'publishDate', widget: 'datetime', required: false }
      - { label: 'Author', name: 'author', widget: 'string' }
      - { label: 'Content', name: 'body', widget: 'markdown' }
  - name: 'projects'
    label: 'Projects'
    folder: 'src/content/projects'
    create: true
    slug: '{{slug}}'
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Description', name: 'description', widget: 'text', required: false }
      - { label: 'Slug', name: 'slug', widget: 'string', required: false }
      - { label: 'Publish Date', name: 'publishDate', widget: 'datetime', required: false }
      - { label: 'Date', name: 'date', widget: 'datetime', required: false }
      - {
          label: 'City',
          name: 'city',
          widget: 'select',
          options:
            [
              { label: 'Иркутск', value: 'irkutsk' },
              { label: 'Ангарск', value: 'angarsk' },
              { label: 'Шелехов', value: 'shelekhov' },
            ],
        }
      - {
          label: 'Service',
          name: 'service',
          widget: 'select',
          options:
            [
              { label: 'Кухни', value: 'kuhni' },
              { label: 'Шкафы', value: 'shkafy' },
              { label: 'Гардеробные', value: 'garderobnye' },
            ],
        }
      - { label: 'District', name: 'district', widget: 'string', required: false }
      - { label: 'Street', name: 'street', widget: 'string' }
      - { label: 'Residential Complex', name: 'complex', widget: 'string', required: false }
      - { label: 'Area (m2)', name: 'area', widget: 'number', required: false, value_type: 'int' }
      - { label: 'Price', name: 'price', widget: 'number', required: false, value_type: 'int' }
      - { label: 'Duration (days)', name: 'duration', widget: 'number', required: false, value_type: 'int' }
      - { label: 'Layout', name: 'layout', widget: 'string', required: false }
      - { label: 'Style', name: 'style', widget: 'string', required: false }
      - label: 'Materials'
        name: 'materials'
        widget: 'object'
        required: false
        fields:
          - { label: 'Facade', name: 'facade', widget: 'string', required: false }
          - { label: 'Tabletop', name: 'tabletop', widget: 'string', required: false }
          - { label: 'Hardware', name: 'hardware', widget: 'string', required: false }
      - { label: 'Images', name: 'images', widget: 'list', required: false }
      - label: 'FAQ'
        name: 'faq'
        widget: 'list'
        required: false
        fields:
          - { label: 'Question', name: 'question', widget: 'string' }
          - { label: 'Answer', name: 'answer', widget: 'text' }
      - { label: 'Draft', name: 'draft', widget: 'boolean', default: false, required: false }
      - { label: 'Content', name: 'body', widget: 'markdown' }
