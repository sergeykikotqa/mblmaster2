# Nginx is the single header authority at the public edge. Hide matching app
# headers before adding one consistent value to avoid duplicate/conflicting
# policies on server-rendered API/admin responses.
proxy_hide_header Content-Security-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Referrer-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://mc.yandex.ru https://www.googletagmanager.com https://www.google-analytics.com https://cdn.splitbee.io https://smartcaptcha.cloud.yandex.ru; script-src-attr 'none'; connect-src 'self' https://mc.yandex.ru https://www.google-analytics.com https://region1.google-analytics.com https://stats.g.doubleclick.net https://api.splitbee.io https://hive.splitbee.io https://smartcaptcha.cloud.yandex.ru; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src 'self' https://vk.com https://vkvideo.ru https://yandex.ru https://*.yandex.ru https://yandex.com https://*.yandex.com https://smartcaptcha.cloud.yandex.ru; media-src 'self' https:" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
add_header Referrer-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
