worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Never log query strings: admin/API tokens can arrive in URL parameters
    # during diagnostics and must not be persisted in container logs.
    log_format mbl_main '$remote_addr - $host "$request_method $uri $server_protocol" $status $body_bytes_sent '
                        'rt=$request_time upstream=$upstream_addr us=$upstream_status';
    access_log /dev/stdout mbl_main;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 64k;

    # All temporary writes stay on the Compose tmpfs. Nothing writes to
    # /var/run or the read-only container filesystem.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/xml
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Docker's embedded DNS plus a resolving upstream allows mbl-web to be
    # recreated without restarting the edge container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream mbl_web {
        zone mbl_web 64k;
        server mbl-web:4321 resolve;
        keepalive 32;
    }

    include /etc/nginx/generated/redirect-host-map.conf;

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        include /etc/nginx/security-headers.conf;

        if ($mbl_canonical_redirect_origin) {
            return 301 https://mebel-irkutsk.ru$request_uri;
        }

        include /etc/nginx/generated/redirect-paths.conf;

        # Keep the branded Astro status documents while preserving the status.
        error_page 404 =404 /__mbl_not_found_internal;
        error_page 410 =410 /__mbl_gone_internal;

        location = /__mbl_not_found_internal {
            internal;
            proxy_hide_header Cache-Control;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/generated/proxy-common.conf;
            proxy_intercept_errors off;
            proxy_pass http://mbl_web/404;
        }

        location = /__mbl_gone_internal {
            internal;
            proxy_hide_header Cache-Control;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/generated/proxy-common.conf;
            proxy_intercept_errors off;
            proxy_pass http://mbl_web/410;
        }

        # Astro/Vite fingerprints these assets; they are safe to cache forever.
        location ^~ /_astro/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Public assets without a content hash get a bounded cache so a later
        # release can replace them without year-long stale clients.
        location ~* \.(?:avif|webp|png|jpe?g|gif|svg|ico|woff2?|woff|ttf|otf)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=604800" always;
            try_files $uri @mbl_app;
        }

        location ~* \.(?:css|js|mjs)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=3600" always;
            try_files $uri @mbl_app;
        }

        # Worker execution is sidecar-only on mbl-backend. Even possession of
        # the bearer token cannot turn the public Nginx edge into a scheduler.
        location ^~ /api/workers/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
            return 403;
        }

        location ^~ /api/ {
            proxy_hide_header Cache-Control;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/generated/proxy-common.conf;
            proxy_pass http://mbl_web;
        }

        location ^~ /health/ {
            proxy_hide_header Cache-Control;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/generated/proxy-common.conf;
            proxy_pass http://mbl_web;
        }

        location = /admin {
            proxy_hide_header Cache-Control;
            proxy_hide_header X-Robots-Tag;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            include /etc/nginx/generated/proxy-common.conf;
            proxy_pass http://mbl_web;
        }

        location ^~ /admin/ {
            proxy_hide_header Cache-Control;
            proxy_hide_header X-Robots-Tag;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            include /etc/nginx/generated/proxy-common.conf;
            proxy_pass http://mbl_web;
        }

        location @mbl_app {
            proxy_hide_header Cache-Control;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/generated/proxy-common.conf;
            proxy_intercept_errors on;
            proxy_pass http://mbl_web;
        }

        # HTML and all other application routes are resolved by Astro Node.
        # no-cache permits revalidation and avoids an unsafe immutable HTML TTL.
        location / {
            proxy_hide_header Cache-Control;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/generated/proxy-common.conf;
            proxy_intercept_errors on;
            proxy_pass http://mbl_web;
        }
    }
}
