# Static proxy contract. Redirect artifacts beside this file are generated by
# scripts/generate-runtime-redirects.mjs.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# The application accepts several provider-specific client IP headers when it
# runs behind a trusted proxy. This Nginx instance is that trust boundary, so
# public callers must not be able to forward any of those values upstream.
proxy_set_header CF-Connecting-IP "";
proxy_set_header X-NF-Client-Connection-IP "";
proxy_set_header True-Client-IP "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Vercel-Forwarded-For "";
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Forwarded "";
proxy_connect_timeout 3s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
proxy_buffering on;
